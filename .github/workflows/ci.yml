name: Continuous Integration & Verification

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ '**' ]
    tags-ignore:
      - 'v*.*.*'

jobs:
  verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Check
        run: npm run lint

      - name: Test Production Compilation
        run: npm run build
