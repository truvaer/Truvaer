name: Build and Publish Docker Image

# This tells GitHub to run this workflow every time you push code to the "main" branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Get the code from your repository
    - name: Check out the code
      uses: actions/checkout@v4

    # Step 2: Log in to Docker Hub using the secrets you just created
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 3: Build the Docker image and push it to your Docker Hub account
    - name: Build and push the Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Change "my-app" to whatever you want your image to be named
        tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest
