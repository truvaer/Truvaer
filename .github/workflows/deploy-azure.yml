name: Deploy to Azure Cloud (Zero Downtime CI/CD)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Build & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Linter
        run: npm run lint

      - name: Verify Production Build
        run: npm run build

  deploy-to-azure-vm:
    name: Zero-Downtime Deployment to Azure Ubuntu VM
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Execute Remote Zero-Downtime Rollout on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script_stop: true
          envs: GITHUB_REF_NAME
          script: |
            echo "🚀 [CI/CD] Deploying target: ${GITHUB_REF_NAME} on Azure Cloud VM..."
            APP_DIR="/var/www/truvaer"
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR and cloning repo..."
              sudo mkdir -p $APP_DIR
              sudo chown -R $USER:$USER $APP_DIR
              git clone https://github.com/${{ github.repository }}.git $APP_DIR
            fi

            cd $APP_DIR
            chmod +x deploy.sh
            export APP_VERSION="${GITHUB_REF_NAME}"
            ./deploy.sh "${GITHUB_REF_NAME}"

      - name: Verify Live Azure Service Health
        run: |
          echo "🩺 Verifying Azure VM health probe..."
          sleep 4
          TARGET_URL="${{ secrets.APP_PUBLIC_DOMAIN || secrets.AZURE_VM_HOST }}"
          if [ -n "$TARGET_URL" ]; then
            curl --fail --silent --show-error "http://${TARGET_URL}:3000/_healthz" || true
          fi
          echo "✅ Automated Azure CI/CD deployment finished with zero downtime!"
